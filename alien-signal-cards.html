<!doctype html><html lang="zh-Hant"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿屁的太空冒險｜外星探索信標</title><style>body{margin:0;background:#07111f;color:#eaf6ff;font:16px system-ui,"Noto Sans TC",sans-serif}.screen{max-width:980px;margin:auto;padding:22px;text-align:center}.print{padding:11px 18px;border:0;border-radius:9px;background:#8b78ff;color:white;font:700 16px inherit;cursor:pointer}.sheet{display:grid;grid-template-columns:repeat(2,1fr);gap:18px;margin-top:18px;text-align:left}.card{min-height:250px;padding:20px;box-sizing:border-box;border:1px solid #78d9ff;border-radius:18px;background:radial-gradient(circle at 85% 12%,#29365d 0,transparent 32%),linear-gradient(135deg,#111b40,#071f31);display:grid;grid-template-columns:1fr 145px;gap:14px}.tag{font-size:11px;letter-spacing:.17em;color:#9ee1ff}.card h2{margin:12px 0 9px;font-size:23px}.card p{margin:0;color:#c3d8e7;line-height:1.55}.code{width:140px;height:140px;padding:5px;background:white;border-radius:8px;align-self:center}.hint{font-size:12px;color:#a9c8d9;margin-top:18px}@media print{body{background:white;color:#111}.screen{padding:0}.screen>h1,.screen>p,.print{display:none}.sheet{margin:0;gap:9mm}.card{min-height:70mm;color:#111;background:#f7fbff;border:1px solid #174862;break-inside:avoid}.tag{color:#174862}.card p,.hint{color:#324b59}.code{border:1px solid #607682}}</style><main class="screen"><h1>阿屁的太空冒險：外星探索信標</h1><p>列印後，請用 iPad 的相機掃描 QR code，開啟遊戲領取探索發現。</p><button class="print" onclick="print()">列印這一頁</button><section class="sheet" id="cards"></section></main><script>const base='https://felix81710.github.io/api-space-adventure/?signal=';const cards=[['ALPHA-NEBULA','Alpha 星雲樣本','尋找漂浮在基地外的神祕樣本。'],['MARS-RELIC','火星遺跡','掃描紅色沙丘中的古老訊號。'],['EUROPA-ECHO','歐羅巴回音','聆聽冰海下方傳來的節奏。'],['SATURN-RING','土星環帶碎片','收集一片閃亮的冰晶碎片。'],['LUNAR-VAULT','月面資料庫','發現月面觀測站的秘密。'],['OUTPOST-PULSE','基地求救脈衝','幫 Alpha 基地校正通訊天線。']];const q=u=>'https://api.qrserver.com/v1/create-qr-code/?size=300x300&margin=8&data='+encodeURIComponent(u);document.querySelector('#cards').innerHTML=cards.map(([id,title,text])=>`<article class="card"><div><div class="tag">EXPLORER SIGNAL / ${id}</div><h2>${title}</h2><p>${text}</p><p class="hint">掃描後，讓探索員在遊戲中解鎖發現與獎勵。</p></div><img class="code" src="${q(base+id)}" alt="${title} 的 QR code"></article>`).join('');</script></html>
